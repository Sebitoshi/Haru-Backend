services:
  postgres:
    image: postgres:16-alpine
    container_name: boti-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: boti
      POSTGRES_PASSWORD: boti_secret_2024
      POSTGRES_DB: boti_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boti -d boti_db']
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: boti-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: boti
      MONGO_INITDB_ROOT_PASSWORD: boti_mongo_secret_2024
      MONGO_INITDB_DATABASE: boti_memory
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
